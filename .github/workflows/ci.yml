name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same Node (and npm 11) as development; npm 10 misreads this lockfile's optional wasm packages.
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails on any high or critical advisory in what ships to production.
      - run: npm run audit
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests, plus database tests on an in-memory Postgres (no secrets, never touches Neon).
      - run: npm test
      - run: npm run build
